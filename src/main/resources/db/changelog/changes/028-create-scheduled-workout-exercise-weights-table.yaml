databaseChangeLog:
  - changeSet:
      id: 028-create-scheduled-workout-exercise-weights-table
      author: burmistrov
      comment: Per-instance working weight the trainer set for one exercise of a scheduled workout.
      changes:
        - createTable:
            tableName: scheduled_workout_exercise_weights
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: scheduled_workout_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sw_exercise_weight_scheduled_workout
                    references: scheduled_workouts(id)
                    deleteCascade: true
              - column:
                  name: workout_template_exercise_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_sw_exercise_weight_template_exercise
                    references: workout_template_exercises(id)
                    deleteCascade: true
              - column:
                  name: weight_kg
                  type: NUMERIC(6,2)
