databaseChangeLog:
  - changeSet:
      id: 021-create-workout-template-exercises-table
      author: burmistrov
      changes:
        - createTable:
            tableName: workout_template_exercises
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workout_template_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workout_template_exercises_workout
                    references: workout_templates(id)
                    deleteCascade: true
              - column:
                  name: exercise_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workout_template_exercises_exercise
                    references: exercises(id)
              - column:
                  name: order_index
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
        - createIndex:
            tableName: workout_template_exercises
            indexName: idx_workout_template_exercises_workout
            columns:
              - column:
                  name: workout_template_id
        - createIndex:
            tableName: workout_template_exercises
            indexName: idx_workout_template_exercises_exercise
            columns:
              - column:
                  name: exercise_id
