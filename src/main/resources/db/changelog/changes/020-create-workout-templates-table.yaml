databaseChangeLog:
  - changeSet:
      id: 020-create-workout-templates-table
      author: burmistrov
      comment: A reusable workout (list of exercises with sets), owned by a trainer — no program, no client, no dates.
      changes:
        - createTable:
            tableName: workout_templates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workout_templates_trainer
                    references: users(id)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: workout_templates
            indexName: idx_workout_templates_trainer
            columns:
              - column:
                  name: trainer_id
