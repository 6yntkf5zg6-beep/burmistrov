databaseChangeLog:
  - changeSet:
      id: 003-create-client-profiles-table
      author: burmistrov
      changes:
        - createTable:
            tableName: client_profiles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_client_profiles_user_id
                    foreignKeyName: fk_client_profiles_user
                    references: users(id)
              - column:
                  name: birth_date
                  type: DATE
              - column:
                  name: gender
                  type: VARCHAR(20)
              - column:
                  name: height_cm
                  type: NUMERIC(5,2)
              - column:
                  name: weight_kg
                  type: NUMERIC(5,2)
              - column:
                  name: goal
                  type: VARCHAR(255)
              - column:
                  name: health_notes
                  type: TEXT
        - sql:
            sql: ALTER TABLE client_profiles ADD CONSTRAINT chk_client_profiles_gender CHECK (gender IS NULL OR gender IN ('MALE','FEMALE','OTHER'))
