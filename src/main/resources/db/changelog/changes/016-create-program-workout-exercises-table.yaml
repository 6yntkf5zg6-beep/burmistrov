databaseChangeLog:
  - changeSet:
      id: 016-create-program-workout-exercises-table
      author: burmistrov
      changes:
        - createTable:
            tableName: program_workout_exercises
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: program_workout_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_program_workout_exercises_workout
                    references: program_workouts(id)
                    deleteCascade: true
              - column:
                  name: exercise_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_program_workout_exercises_exercise
                    references: exercises(id)
              - column:
                  name: order_index
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: sets
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: reps
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: weight_kg
                  type: NUMERIC(6,2)
              - column:
                  name: rest_seconds
                  type: INT
              - column:
                  name: tempo
                  type: VARCHAR(20)
              - column:
                  name: notes
                  type: TEXT
        - createIndex:
            tableName: program_workout_exercises
            indexName: idx_program_workout_exercises_workout
            columns:
              - column:
                  name: program_workout_id
        - createIndex:
            tableName: program_workout_exercises
            indexName: idx_program_workout_exercises_exercise
            columns:
              - column:
                  name: exercise_id
