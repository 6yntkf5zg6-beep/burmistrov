databaseChangeLog:
  - changeSet:
      id: 036-site-content
      author: burmistrov
      comment: >
        Патенты и публикации автора переезжают из вёрстки в базу: тренер правит их сам,
        без релиза. Порядок хранится явным полем — на главной он смысловой, а не
        алфавитный и не по дате создания.
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE patents (
                  id          BIGSERIAL PRIMARY KEY,
                  number      VARCHAR(120) NOT NULL,
                  title       TEXT         NOT NULL,
                  scan_url    VARCHAR(500),
                  sort_order  INT          NOT NULL,
                  created_at  TIMESTAMPTZ  NOT NULL DEFAULT now(),
                  updated_at  TIMESTAMPTZ  NOT NULL DEFAULT now()
              );

              CREATE TABLE publications (
                  id          BIGSERIAL PRIMARY KEY,
                  title       TEXT NOT NULL,
                  authors     TEXT NOT NULL,
                  annotation  TEXT NOT NULL,
                  sort_order  INT  NOT NULL,
                  created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
                  updated_at  TIMESTAMPTZ NOT NULL DEFAULT now()
              );

              CREATE INDEX idx_patents_sort_order ON patents (sort_order, id);
              CREATE INDEX idx_publications_sort_order ON publications (sort_order, id);

  - changeSet:
      id: 036-site-content-seed
      author: burmistrov
      comment: >
        Переносим в базу то, что до сих пор было зашито в вёрстку, чтобы после миграции
        главная выглядела так же. Сканы трёх патентов лежат в uploads рядом с остальными
        загрузками; у двух оставшихся скана нет — карточка отрисуется бланком.
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              INSERT INTO patents (number, title, scan_url, sort_order) VALUES
                  ('№ 104470', 'Тренировочное устройство для выполнения упражнений в положении лёжа', '/uploads/patent-104470.jpg', 1),
                  ('№ 2375095', 'Способ увеличения мышечной массы и силовых качеств', '/uploads/patent-2375095.jpg', 2),
                  ('№ 2399397', 'Способ воздействия на мышцы спины', '/uploads/patent-2399397.jpg', 3),
                  ('№ 2491907', 'Способ воздействия на мышцы верхней части спины', NULL, 4),
                  ('№ 18934', 'Тренажёр для развития длинных мышц спины', NULL, 5);

              INSERT INTO publications (title, authors, annotation, sort_order) VALUES
                  ('Боль в спине = Back Pain',
