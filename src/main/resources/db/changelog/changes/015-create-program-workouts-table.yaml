databaseChangeLog:
  - changeSet:
      id: 015-create-program-workouts-table
      author: burmistrov
      changes:
        - createTable:
            tableName: program_workouts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: training_program_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_program_workouts_program
                    references: training_programs(id)
                    deleteCascade: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: order_index
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
        - createIndex:
            tableName: program_workouts
            indexName: idx_program_workouts_program
            columns:
              - column:
                  name: training_program_id
