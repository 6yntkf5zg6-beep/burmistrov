databaseChangeLog:
  - changeSet:
      id: 013-cascade-training-plan-deletes
      author: burmistrov
      comment: >
        Deleting a training plan should take its workouts, workout exercises, workout logs and
        exercise logs with it — none of those are meaningful without the plan they belong to.
      changes:
        - dropForeignKeyConstraint:
            baseTableName: workouts
            constraintName: fk_workouts_training_plan
        - addForeignKeyConstraint:
            baseTableName: workouts
            baseColumnNames: training_plan_id
            constraintName: fk_workouts_training_plan
            referencedTableName: training_plans
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workout_exercises
            constraintName: fk_workout_exercises_workout
        - addForeignKeyConstraint:
            baseTableName: workout_exercises
            baseColumnNames: workout_id
            constraintName: fk_workout_exercises_workout
            referencedTableName: workouts
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workout_logs
            constraintName: fk_workout_logs_workout
        - addForeignKeyConstraint:
            baseTableName: workout_logs
            baseColumnNames: workout_id
            constraintName: fk_workout_logs_workout
            referencedTableName: workouts
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workout_exercise_logs
            constraintName: fk_workout_exercise_logs_log
        - addForeignKeyConstraint:
            baseTableName: workout_exercise_logs
            baseColumnNames: workout_log_id
            constraintName: fk_workout_exercise_logs_log
            referencedTableName: workout_logs
            referencedColumnNames: id
            onDelete: CASCADE
        - dropForeignKeyConstraint:
            baseTableName: workout_exercise_logs
            constraintName: fk_workout_exercise_logs_we
        - addForeignKeyConstraint:
            baseTableName: workout_exercise_logs
            baseColumnNames: workout_exercise_id
            constraintName: fk_workout_exercise_logs_we
            referencedTableName: workout_exercises
            referencedColumnNames: id
            onDelete: CASCADE
