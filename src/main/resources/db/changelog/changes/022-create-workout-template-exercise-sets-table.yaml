databaseChangeLog:
  - changeSet:
      id: 022-create-workout-template-exercise-sets-table
      author: burmistrov
      comment: Same per-set breakdown as program_workout_exercise_sets, but for reusable (non-program) workouts.
      changes:
        - createTable:
            tableName: workout_template_exercise_sets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workout_template_exercise_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workout_template_exercise_sets_we
                    references: workout_template_exercises(id)
                    deleteCascade: true
              - column:
                  name: set_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: reps
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: weight_kg
                  type: NUMERIC(6,2)
        - createIndex:
            tableName: workout_template_exercise_sets
            indexName: idx_workout_template_exercise_sets_we
            columns:
              - column:
                  name: workout_template_exercise_id
