databaseChangeLog:
  - changeSet:
      id: 009-create-workout-logs-table
      author: burmistrov
      changes:
        - createTable:
            tableName: workout_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workout_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workout_logs_workout
                    references: workouts(id)
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_workout_logs_client
                    references: users(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: IN_PROGRESS
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: duration_minutes
                  type: INT
              - column:
                  name: client_feedback
                  type: TEXT
        - createIndex:
            tableName: workout_logs
            indexName: idx_workout_logs_workout
            columns:
              - column:
                  name: workout_id
        - createIndex:
            tableName: workout_logs
            indexName: idx_workout_logs_client
            columns:
              - column:
                  name: client_id
        - sql:
            sql: ALTER TABLE workout_logs ADD CONSTRAINT chk_workout_logs_status CHECK (status IN ('IN_PROGRESS','COMPLETED','SKIPPED'))
