databaseChangeLog:
  - changeSet:
      id: 024-create-scheduled-workouts-table
      author: burmistrov
      comment: Links a reusable workout (from the "Тренировки" catalog) to a specific calendar date for a specific client — shown on the trainer's client calendar.
      changes:
        - createTable:
            tableName: scheduled_workouts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: trainer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_scheduled_workouts_trainer
                    references: users(id)
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_scheduled_workouts_client
                    references: users(id)
              - column:
                  name: workout_template_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_scheduled_workouts_template
                    references: workout_templates(id)
                    deleteCascade: true
              - column:
                  name: scheduled_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: scheduled_workouts
            indexName: idx_scheduled_workouts_trainer_client_date
            columns:
              - column:
                  name: trainer_id
              - column:
                  name: client_id
              - column:
                  name: scheduled_date
